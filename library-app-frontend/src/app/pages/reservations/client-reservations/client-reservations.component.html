<div class="mat-shadow-2">

  <mat-form-field>
    <mat-label>Client</mat-label>
    <mat-select placeholder="Client" [value]="$clientId()" (valueChange)="selectClient($event)">
      @for (client of $clients(); track client.id) {
        <mat-option [value]="client.id">{{ client.firstName }} {{ client.lastName }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  @if ($clientId() === null) {
    <p>Select a client to see its reservations.</p>
  } @else {

    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
        <td mat-cell *matCellDef="let row"> {{row.id}} </td>
      </ng-container>

      <ng-container matColumnDef="reservationDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
        <td mat-cell *matCellDef="let row"> {{row.reservationDate | date: 'short'}} </td>
      </ng-container>

      <ng-container matColumnDef="books">
        <th mat-header-cell *matHeaderCellDef> Books </th>
        <td mat-cell *matCellDef="let row"> {{bookTitles(row)}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of client reservations"
      [length]="$totalElements()"
      [pageSize]="$pageRequest().size"
      [pageIndex]="$pageRequest().page"
      (page)="changePage($event)"
    ></mat-paginator>

  }

</div>
