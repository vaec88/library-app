<div class="detail-picker">

    <mat-form-field>
        <mat-label>Book</mat-label>
        <mat-select placeholder="Book" [value]="$selectedBookId()" (valueChange)="select($event)">
            @for (book of $selectableBooks(); track book.id) {
                <mat-option [value]="book.id">{{ book.title }}</mat-option>
            }
        </mat-select>
    </mat-form-field>

    <button mat-flat-button type="button" [disabled]="$selectedBookId() === null" (click)="add()">
        <span>Add</span>
        <mat-icon>add</mat-icon>
    </button>

</div>

<table mat-table [dataSource]="$details()">

    <ng-container matColumnDef="bookId">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let row"> {{row.bookId}} </td>
    </ng-container>

    <ng-container matColumnDef="bookTitle">
        <th mat-header-cell *matHeaderCellDef> Title </th>
        <td mat-cell *matCellDef="let row"> {{row.bookTitle}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let row">
            <button mat-flat-button type="button" class="cancel-button" (click)="remove(row.bookId)">
                <span>Remove</span>
                <mat-icon>delete</mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>

@if ($details().length === 0) {
    <small class="invalid">Add at least one book</small>
}
